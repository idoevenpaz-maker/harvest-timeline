<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>טרור יהודי</title>
  <meta name="description" content="ציר זמן של אירועי אלימות מתנחלים נגד פלסטינים בגדה המערבית, יום אחר יום, עם כתבות וסרטונים לכל אירוע. הנתונים: יש דין.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 class="title">טרור יהודי</h1>
      <p class="lede" id="lede">אירועי אלימות של מתנחלים נגד פלסטינים בגדה המערבית, יום אחר יום.</p>
    </div>
  </header>

  <section class="season" aria-label="מספר האירועים בכל יום">
    <div class="wrap">
      <div class="season-legend">
        <span class="key key-harvest">אירועי מסיק</span>
        <span class="key key-other">אירועים אחרים</span>
        <span class="key key-killed">יום שבו נהרג אדם</span>
        <span class="season-hint">לחצו על יום כדי לקפוץ אליו</span>
      </div>
      <div class="strip" id="strip" role="list"></div>
      <div class="strip-axis" id="strip-axis" aria-hidden="true"></div>
    </div>
  </section>

  <nav class="filters" aria-label="סינון">
    <div class="wrap filters-row">
      <div class="seg" role="radiogroup" aria-label="קבוצת אירועים">
        <button type="button" role="radio" aria-checked="true" data-tab="all">הכל</button>
        <button type="button" role="radio" aria-checked="false" data-tab="harvest">מסיק</button>
        <button type="button" role="radio" aria-checked="false" data-tab="other">אחרים</button>
      </div>
      <label class="field">
        <span>סוג עבירה</span>
        <select id="f-offence"><option value="">הכל</option></select>
      </label>
      <label class="field">
        <span>יישוב</span>
        <input id="f-place" list="places-list" placeholder="כל היישובים" autocomplete="off">
        <datalist id="places-list"></datalist>
      </label>
      <label class="check">
        <input type="checkbox" id="f-media">
        <span>רק עם כתבות או סרטונים</span>
      </label>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
  </nav>

  <main class="wrap" id="timeline" aria-label="ציר הזמן"></main>

  <footer class="foot">
    <div class="wrap">
      <p>הנתונים על האירועים: <a href="https://www.yesh-din.org/settler-violence-during-the-olive-harvest/" target="_blank" rel="noopener">יש דין</a>. עודכנו לאחרונה ב-<span id="updated">—</span>. נתוני הימים האחרונים חלקיים ועשויים להשתנות.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
